<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Pixie</title>
<style>
:root {
  --bg: #0e0f13; --panel: #171922; --line: #262a37; --ink: #eceef4; --quiet: #8b90a3;
  --user: #3b6fd8; --user-ink: #fff; --pixie: #1f2230; --accent: #7aa8ff; --ok: #3ecf8e; --bad: #ff6b6b; --warn: #f5b942;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f5f6fa; --panel: #ffffff; --line: #dfe2ec; --ink: #151821; --quiet: #666c80;
    --user: #2f5fcb; --pixie: #e9ecf4; --accent: #2f5fcb; --ok: #14935c; --bad: #d23c3c; --warn: #b87a05; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--quiet); flex: none; }
.dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
.status { color: var(--quiet); font-size: 13px; flex: 1; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:active { transform: scale(.98); }
button.primary { background: var(--user); color: var(--user-ink); border-color: transparent; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
#chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
.msg.pixie { align-self: flex-start; background: var(--pixie); border-bottom-left-radius: 4px; }
.msg.note { align-self: center; color: var(--quiet); font-size: 13px; background: none; padding: 2px; text-align: center; }
.msg.thinking { color: var(--quiet); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
.chips button { font-size: 14px; color: var(--accent); padding: 6px 12px; }
.card { align-self: stretch; border: 1px solid var(--warn); background: var(--panel); border-radius: 14px; padding: 14px; }
.card h2 { margin: 0 0 2px; font-size: 16px; } .card p { margin: 0 0 8px; color: var(--quiet); }
.perms { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.perm { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); }
.perm.none { border-color: var(--ok); color: var(--ok); }
details { margin: 8px 0; } summary { color: var(--accent); cursor: pointer; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12.5px; margin: 8px 0 0; }
.actions { display: flex; gap: 10px; margin-top: 10px; } .actions button { flex: 1; padding: 12px; }
form { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); align-items: flex-end; }
textarea { flex: 1; resize: none; max-height: 120px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 14px; outline: none; }
textarea:focus { border-color: var(--accent); }
form button { height: 44px; min-width: 44px; border-radius: 22px; }
#mic.live { background: var(--bad); color: #fff; border-color: transparent; }
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; z-index: 5; }
#sheet.open { display: flex; }
#sheet .inner { background: var(--panel); width: 100%; max-height: 80%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px; }
.skill { padding: 10px 0; border-bottom: 1px solid var(--line); } .skill b { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.skill small { color: var(--quiet); display: block; } .tag { font-size: 11px; color: var(--quiet); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot" title="Brain connection"></span>
  <h1>Pixie</h1>
  <span id="status" class="status">connecting…</span>
  <button id="speak" type="button" aria-pressed="false" title="Read replies aloud">🔈</button>
  <button id="skills" type="button">Skills</button>
</header>

<main id="chat" aria-live="polite"></main>
<div id="chips" class="chips"></div>

<form id="form" autocomplete="off">
  <button id="mic" type="button" title="Speak" aria-label="Speak">🎤</button>
  <textarea id="text" rows="1" placeholder="Ask Pixie anything…" aria-label="Message"></textarea>
  <button id="send" class="primary" type="submit" aria-label="Send">➤</button>
</form>

<div id="sheet" role="dialog" aria-label="Installed skills"><div class="inner">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Skills</h2><button id="close" type="button">Close</button></div>
  <div id="skilllist"></div>
</div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chat = $("chat"), text = $("text"), form = $("form"), send = $("send");
let busy = false, speakOn = false;

function add(kind, content) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = content;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

// Speech: the computer synthesizes it (the phone has no voice engine), this page plays it.
let playing = Promise.resolve();
function speak(content) {
  if (!content) return;
  playing = playing.then(async () => {
    try {
      const res = await fetch("/api/tts", { method: "POST", body: JSON.stringify({ text: content.slice(0, 500) }) });
      if (!res.ok) throw new Error((await res.json()).error || res.status);
      const url = URL.createObjectURL(await res.blob());
      const audio = new Audio(url);
      await new Promise((done, fail) => { audio.onended = done; audio.onerror = () => fail(new Error("can't play audio")); audio.play().catch(fail); });
      URL.revokeObjectURL(url);
    } catch (e) {
      add("note", "Speech: " + e.message);
    }
  });
}

async function ask(content) {
  if (busy || !content.trim()) return;
  busy = true; send.disabled = true;
  add("user", content);
  $("chips").innerHTML = "";
  const thinking = add("pixie thinking", "Thinking…");
  try {
    const res = await fetch("/api/ask", { method: "POST", body: JSON.stringify({ text: content }) });
    const data = await res.json();
    thinking.remove();
    if (data.error) add("note", data.error);
    else {
      add("pixie", data.reply || "…");
      if (speakOn) speak(data.reply);
      draw(data);
    }
  } catch (e) {
    thinking.remove();
    add("note", "Can't reach Pixie: " + e.message);
  }
  busy = false; send.disabled = false; text.focus();
}

let card = null;
function draw(state) {
  $("dot").className = "dot " + (state.brain ? "on" : "off");
  $("status").textContent = state.brain ? "brain connected" : "brain offline: start the bridge on the computer";
  (state.speak || []).forEach(speak);
  if (card) { card.remove(); card = null; }
  if (state.pending) {
    const p = state.pending;
    card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h2"); h.textContent = "New skill: " + p.name;
    const d = document.createElement("p"); d.textContent = p.description;
    const perms = document.createElement("div"); perms.className = "perms";
    if (!p.permissions.length) { const x = document.createElement("span"); x.className = "perm none"; x.textContent = "needs no permissions"; perms.appendChild(x); }
    p.permissions.forEach((name) => { const x = document.createElement("span"); x.className = "perm"; x.textContent = "can use: " + name; perms.appendChild(x); });
    const det = document.createElement("details"); const sum = document.createElement("summary"); sum.textContent = "Show the code";
    const pre = document.createElement("pre"); pre.textContent = p.code; det.append(sum, pre);
    const actions = document.createElement("div"); actions.className = "actions";
    const yes = document.createElement("button"); yes.className = "primary"; yes.textContent = "Install"; yes.onclick = () => ask("yes");
    const no = document.createElement("button"); no.className = "danger"; no.textContent = "Discard"; no.onclick = () => ask("no");
    actions.append(yes, no);
    card.append(h, d, perms, det, actions);
    chat.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
  }
  renderSkills(state.skills || []);
}

function renderSkills(skills) {
  const list = $("skilllist"); list.textContent = "";
  skills.forEach((s) => {
    const row = document.createElement("div"); row.className = "skill";
    const b = document.createElement("b"); b.textContent = s.name;
    const t = document.createElement("span"); t.className = "tag"; t.textContent = s.tier === "ai_authored" ? "written by Pixie" : s.tier;
    const small = document.createElement("small");
    small.textContent = s.description + (s.permissions.length ? "  ·  uses " + s.permissions.join(", ") : "");
    row.append(b, t, small); list.appendChild(row);
  });
}

form.addEventListener("submit", (e) => { e.preventDefault(); const v = text.value; text.value = ""; text.style.height = ""; ask(v); });
text.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
text.addEventListener("input", () => { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, 120) + "px"; });
$("skills").onclick = () => $("sheet").classList.add("open");
$("close").onclick = () => $("sheet").classList.remove("open");
$("sheet").onclick = (e) => { if (e.target === $("sheet")) $("sheet").classList.remove("open"); };
$("speak").onclick = () => { speakOn = !speakOn; $("speak").setAttribute("aria-pressed", speakOn); $("speak").textContent = speakOn ? "🔊" : "🔈"; if (speakOn) speak("Voice on."); };

// Voice input, where the browser has it.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) { $("mic").style.display = "none"; }
else {
  const rec = new Recognition(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onresult = (e) => { const said = e.results[0][0].transcript; speakOn = true; $("speak").textContent = "🔊"; ask(said); };
  rec.onend = () => $("mic").classList.remove("live");
  rec.onerror = (e) => add("note", "Voice input: " + e.error);
  $("mic").onclick = () => { try { rec.start(); $("mic").classList.add("live"); } catch (_) { rec.stop(); } };
}

["What time is it?", "Battery level", "Make a skill that shows free storage", "What can you do?"]
  .forEach((q) => { const b = document.createElement("button"); b.type = "button"; b.textContent = q; b.onclick = () => ask(q); $("chips").appendChild(b); });

add("note", "Pixie runs on this phone. Ask for anything; if there's no skill for it, Pixie writes one and asks you to approve it.");
fetch("/api/state").then((r) => r.json()).then(draw).catch(() => { $("status").textContent = "can't reach Pixie"; });
// Pick up anything a skill asked to say aloud (and keep the status dot honest).
setInterval(() => { if (!busy && !document.hidden) fetch("/api/state").then((r) => r.json()).then((st) => { if (!card && !st.pending) draw(st); else { (st.speak || []).forEach(speak); $("dot").className = "dot " + (st.brain ? "on" : "off"); } }).catch(() => {}); }, 2000);
</script>
</body>
</html>
