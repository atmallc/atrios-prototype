[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pixie-skill = { path = "crates/pixie-skill" }
pixie-runtime = { path = "crates/pixie-runtime" }
pixie-agent = { path = "crates/pixie-agent" }
pixie-skills-basic = { path = "crates/pixie-skills-basic" }
